<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Promesse — Muy pronto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --ink:#2B1D16;
    --ink-soft:#5E4B41;
    --paper:#FBF6F2;
    --rose:#E7BDB0;
    --rose-deep:#C9836C;
    --rose-pale:#F5E4DD;
    --wa:#2FAE60;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--paper); overscroll-behavior-y:none; }
  body{
    min-height:100vh;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
    position:relative;
    overflow:hidden;
  }
  .bg-sheep{
    position:absolute; width:340px; opacity:0.05;
    right:-60px; bottom:-40px; pointer-events:none;
  }
  .bg-sheep.top{
    right:auto; left:-70px; top:-60px; bottom:auto; width:220px;
    transform:scaleX(-1);
  }
  .card{
    position:relative; z-index:2;
    max-width:380px; width:100%;
    text-align:center;
    display:flex; flex-direction:column; align-items:center;
    background:#FFFFFF;
    border-radius:28px;
    padding:38px 26px 30px;
    box-shadow:0 12px 40px rgba(43,29,22,0.08);
  }
  .logo{ width:180px; height:180px; object-fit:contain; margin-bottom:6px; }
  .eyebrow{
    font-size:11.5px; text-transform:uppercase; letter-spacing:0.18em;
    color:var(--rose-deep); font-weight:700; margin-top:6px;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:700; font-size:30px;
    margin-top:14px; line-height:1.3; color:#000000;
  }
  p{
    font-size:14.5px; color:#33261F; line-height:1.6; margin-top:14px; max-width:300px; font-weight:500;
  }
  .divider{
    width:36px; height:2px; background:var(--rose); border-radius:2px; margin:20px 0;
  }
  .wa-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--wa); color:#fff; text-decoration:none;
    font-size:14px; font-weight:700; padding:13px 22px; border-radius:24px;
    margin-top:6px;
  }
  .socials{
    margin-top:22px; font-size:12.5px; color:var(--ink-soft);
  }
  .socials a{ color:var(--ink); font-weight:600; text-decoration:none; }
  footer{
    position:absolute; bottom:18px; left:0; right:0;
    text-align:center; font-size:10.5px; color:#B7A79D; z-index:2;
  }
</style>
</head>
